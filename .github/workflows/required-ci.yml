name: Required CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify canonical release metadata
        run: python3 tools/release/sync_release_metadata.py
      - name: Run release-tool contracts
        run: |
          python3 -m unittest discover -s tools/release/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/checkpoints/tests -p 'test_*.py'
      - name: Reject whitespace errors
        run: git diff --check

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable revision and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Compile daemon and focused tests
        run: |
          docker build \
            --build-arg NPROC=2 \
            --build-arg EPOSE_BUILD_TARGETS="daemon unit_tests epose_unit_tests" \
            -f Dockerfile.epose-dev \
            -t qwertycoin-core:required-ci .
      - name: Verify daemon binary
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/qwertycoind \
            qwertycoin-core:required-ci --version
      - name: Run EPoSE tests
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/qwertycoin-epose-unit-tests \
            qwertycoin-core:required-ci
      - name: Run serialization and foundational unit tests
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/qwertycoin-unit-tests \
            qwertycoin-core:required-ci \
            --data-dir=/usr/local/share/qwertycoin/tests/data \
            --gtest_filter='Serialization.*:JsonSerialization.*:JsonRpcSerialization.*:base58_*.*:qwc_address_branding.*:vercmp.*:checkpoints_default_mainnet.*:checkpoints_is_alternative_block_allowed.*:version.*:rpc.is_version_string_valid'

      - name: Export checksum-bound canary binaries from the tested image
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          mkdir canary-binaries
          container=$(docker create qwertycoin-core:required-ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          for program in qwertycoind qwertycoin-unit-tests qwertycoin-epose-unit-tests; do
            docker cp "$container:/usr/local/bin/$program" "canary-binaries/$program"
          done
          git rev-parse HEAD > canary-binaries/source-revision.txt
          git submodule status --recursive > canary-binaries/submodules.txt
          docker run --rm --entrypoint /usr/local/bin/qwertycoind \
            qwertycoin-core:required-ci --version > canary-binaries/version.txt
          (cd canary-binaries && sha256sum qwertycoind qwertycoin-unit-tests \
            qwertycoin-epose-unit-tests source-revision.txt submodules.txt version.txt > SHA256SUMS)

      - name: Retain tested binaries for an explicitly authorized canary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-canary-${{ github.event.pull_request.head.sha || github.sha }}
          path: canary-binaries
          if-no-files-found: error
          retention-days: 7

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            cores = 2
            max-jobs = 2
      - name: Evaluate Linux and Darwin modules on both architectures
        run: nix flake check --all-systems --no-build
      - name: Build the Linux package
        run: nix build --no-link --print-build-logs .#packages.x86_64-linux.qwertycoin
      - name: Check modules and daemon runtime behavior
        run: nix flake check --print-build-logs

  required:
    name: required
    if: always()
    needs: [metadata, linux, nix]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          test "$METADATA_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$NIX_RESULT" = success
