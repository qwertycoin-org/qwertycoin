name: qwc/windows-epose-keystore-acl

on:
  pull_request:
    paths:
      - ".github/workflows/windows-epose-keystore-acl.yml"
      - "src/cryptonote_core/cryptonote_core.cpp"
      - "src/cryptonote_core/cryptonote_core.h"
      - "src/epose/**"
      - "tests/epose/windows_keystore_runtime.ps1"
      - "tests/epose/windows_standard_user_runtime.ps1"
      - "tests/unit_tests/CMakeLists.txt"
      - "tests/unit_tests/epose_keystore_v2_probe.cpp"
      - "tests/unit_tests/epose_service_keystore_v2.cpp"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwc-windows-epose-keystore-acl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-keystore-acl:
    name: Published repro and native ACL regression
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      RELEASE_REVISION: b5e8600e5b4f0785c4551bd1c9ad2e1eb2f9d5ae
      RELEASE_TAG: v2.0.0
      RELEASE_ARCHIVE: qwertycoin-v2.0.0-windows-x86_64.zip
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - name: Checkout exact change under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Verify affected release ancestry
        shell: pwsh
        run: |
          if ((git rev-parse "$env:RELEASE_TAG^{commit}") -ne $env:RELEASE_REVISION) {
            throw "release tag does not resolve to the expected source revision"
          }
          git merge-base --is-ancestor $env:RELEASE_REVISION HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "change under test is not based on the affected release"
          }

      - name: Download and verify published Windows release
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseRoot = Join-Path $env:RUNNER_TEMP "qwc-v2.0.0-release-repro"
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null
          $base = "https://github.com/qwertycoin-org/qwertycoin/releases/download/$env:RELEASE_TAG"
          $archive = Join-Path $releaseRoot $env:RELEASE_ARCHIVE
          $sums = Join-Path $releaseRoot "SHA256SUMS"
          Invoke-WebRequest -UseBasicParsing -Uri "$base/$env:RELEASE_ARCHIVE" -OutFile $archive
          Invoke-WebRequest -UseBasicParsing -Uri "$base/SHA256SUMS" -OutFile $sums
          $line = Get-Content -LiteralPath $sums | Where-Object { $_ -match [regex]::Escape($env:RELEASE_ARCHIVE) }
          if (@($line).Count -ne 1 -or $line -notmatch '^([0-9a-f]{64})\s+') {
            throw "published release checksum is missing or ambiguous"
          }
          $expected = $Matches[1]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "published Windows release checksum mismatch"
          }
          $expanded = Join-Path $releaseRoot "expanded"
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $daemon = @(Get-ChildItem -Path $expanded -Filter qwertycoind.exe -File -Recurse)
          if ($daemon.Count -ne 1) {
            throw "published archive must contain exactly one qwertycoind.exe"
          }
          "daemon=$($daemon[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Reproduce restart failure with published binary
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          ./tests/epose/windows_keystore_runtime.ps1 -Mode ReproduceReleaseBug -DaemonPath '${{ steps.release.outputs.daemon }}' -TestRoot (Join-Path $env:RUNNER_TEMP "qwc-published-keystore-repro")

      - name: Configure native MSYS2 toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git base-devel
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libgcrypt mingw-w64-x86_64-libgpg-error
            mingw-w64-x86_64-zeromq mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-unbound mingw-w64-x86_64-expat
            mingw-w64-x86_64-hidapi mingw-w64-x86_64-libusb
            mingw-w64-x86_64-protobuf mingw-w64-x86_64-gtest

      - name: Initialize pinned recursive submodules
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'MINGW64_BIN=%s\n' "$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Configure focused native Windows build
        shell: msys2 {0}
        run: |
          cmake -S . -B build/windows-keystore -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_64=ON -DSTATIC=OFF \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=ON -DBUILD_DOCUMENTATION=OFF \
            -DBUILD_DEBUG_UTILITIES=OFF -DUSE_DEVICE_TREZOR=OFF -DUSE_READLINE=OFF \
            -DMANUAL_SUBMODULES=1 -DMONERO_PARALLEL_COMPILE_JOBS=2 \
            -DMONERO_PARALLEL_LINK_JOBS=1

      - name: Build daemon and focused keystore tests
        shell: msys2 {0}
        run: >-
          cmake --build build/windows-keystore
          --target daemon epose_keystore_v2_probe epose_keystore_v2_tests
          --parallel 2

      - name: Run native ACL regression tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          build/windows-keystore/tests/unit_tests/epose_keystore_v2_tests.exe \
            --gtest_color=yes

      - name: Prove four independent native process loads
        shell: msys2 {0}
        run: |
          set -euo pipefail
          probe=build/windows-keystore/tests/unit_tests/epose_keystore_v2_probe.exe
          root="$RUNNER_TEMP/qwc-windows-probe"
          mkdir "$root"
          key="$root/service.keys"
          for run in 1 2 3 4; do "$probe" "$key" >"$root/run-$run.txt"; done
          ids=$(sed -E 's/^status=[^ ]+ //' "$root/run-1.txt")
          test "$(sed -E 's/^status=[^ ]+ //' "$root/run-2.txt")" = "$ids"
          test "$(sed -E 's/^status=[^ ]+ //' "$root/run-3.txt")" = "$ids"
          test "$(sed -E 's/^status=[^ ]+ //' "$root/run-4.txt")" = "$ids"
          test "$(sed -n 's/^status=\([^ ]*\).*/\1/p' "$root/run-1.txt")" = created
          for run in 2 3 4; do
            test "$(sed -n 's/^status=\([^ ]*\).*/\1/p' "$root/run-$run.txt")" = loaded
          done
          printf '%s\n' 'native_process_probe=pass starts=4 identities=stable'

      - name: Verify fixed daemon restarts and one-file ACL repair
        shell: pwsh
        run: |
          $env:PATH = "$env:MINGW64_BIN;$env:PATH"
          $daemon = (Resolve-Path ./build/windows-keystore/bin/qwertycoind.exe).Path
          ./tests/epose/windows_keystore_runtime.ps1 -Mode VerifyFixed -DaemonPath $daemon -TestRoot (Join-Path $env:RUNNER_TEMP "qwc-fixed-keystore-runtime")

      - name: Repeat fixed runtime proof with a restricted standard-user token
        shell: pwsh
        run: |
          $daemon = (Resolve-Path ./build/windows-keystore/bin/qwertycoind.exe).Path
          ./tests/epose/windows_standard_user_runtime.ps1 `
            -DaemonPath $daemon `
            -RuntimeBin $env:MINGW64_BIN `
            -TestRoot (Join-Path $env:RUNNER_TEMP "qwc-standard-user-keystore")

      - name: Reject secret material in test logs
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path $env:RUNNER_TEMP "qwc-published-keystore-repro"),
            (Join-Path $env:RUNNER_TEMP "qwc-fixed-keystore-runtime"),
            (Join-Path $env:RUNNER_TEMP "qwc-standard-user-keystore\runtime")
          )
          foreach ($root in $roots) {
            $logs = Get-ChildItem -Path $root -File -Filter "run-*" -ErrorAction Stop
            $matches = $logs | Select-String -Pattern 'operator_secret_key|service_secret_key'
            if ($matches) {
              throw "secret key material appeared in a daemon test log"
            }
          }
