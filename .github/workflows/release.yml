name: qwc/core-release-candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact version tag, for example v2.0.0-rc1"
        required: true
        default: "v2.0.0-rc1"
        type: string
      expected_revision:
        description: "Exact lowercase 40-character Core commit SHA"
        required: true
        type: string
      target:
        description: "Build all platforms or one native candidate"
        required: true
        default: linux
        type: choice
        options: [all, linux, macos, windows]
      stable_gate_policy:
        description: "Non-RC only: require a ready candidate-bound EPoSE gate, or build an explicitly authorized public-test client"
        required: true
        default: require-ready
        type: choice
        options: [require-ready, public-test]

permissions:
  contents: read

jobs:
  preflight:
    name: Validate immutable request and release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      TARGET: ${{ inputs.target }}
      STABLE_GATE_POLICY: ${{ inputs.stable_gate_policy }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_revision }}
          fetch-depth: 0
          submodules: recursive
          path: source
          persist-credentials: false
      - name: Validate source line, version, tag and EPoSE gate
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_REVISION"
          git -C control cat-file -e "${EXPECTED_REVISION}^{commit}"
          git -C control merge-base --is-ancestor "$EXPECTED_REVISION" "$GITHUB_SHA"
          (cd source && ../control/tools/release/check_source_tree.sh "$EXPECTED_REVISION")
          (cd source && ../control/tools/release/validate_release_request.py \
            --release-tag "$RELEASE_TAG" --expected-revision "$EXPECTED_REVISION" --target "$TARGET" \
            --output ../release-request.json)
          release_version=$(python3 -c 'import json; print(json.load(open("release-request.json"))["release_version"])')
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-rc* ]]; then
            test "$STABLE_GATE_POLICY" = require-ready
          elif [[ "$STABLE_GATE_POLICY" != require-ready && "$STABLE_GATE_POLICY" != public-test ]]; then
            echo "unsupported stable gate policy" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != *-rc* && "$STABLE_GATE_POLICY" == require-ready ]]; then
            control/tools/release/evaluate_release_gate.py \
              --repository source --expected-revision "$EXPECTED_REVISION" \
              --output epose-release-gate.json --require-ready
          else
            control/tools/release/evaluate_release_gate.py \
              --repository source --expected-revision "$EXPECTED_REVISION" \
              --output epose-release-gate.json
          fi

  linux-x86_64:
    name: Linux x86_64
    needs: preflight
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    concurrency:
      group: qwc-core-linux-${{ inputs.release_tag }}-${{ inputs.expected_revision }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      ARTIFACT_NAME: qwertycoin-${{ inputs.release_tag }}-linux-x86_64
      CCACHE_DIR: .ccache-linux
      QWC_LINUX_GLIBC_CEILING: "2.35"
      QWC_LINUX_GLIBCXX_CEILING: "3.4.30"
      STABLE_GATE_POLICY: ${{ inputs.stable_gate_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_revision }}
          fetch-depth: 0
          submodules: recursive
          path: source
          persist-credentials: false
      - name: Verify source and prepare identical local tag state
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          (cd source && ../control/tools/release/check_source_tree.sh "$EXPECTED_REVISION")
          (cd source && ../control/tools/release/prepare_source_tag.sh "$RELEASE_TAG" "$EXPECTED_REVISION")
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git ccache python3 curl file patchelf binutils zip \
            libboost-all-dev libssl-dev libzmq3-dev libpgm-dev libunbound-dev libsodium-dev \
            libhidapi-dev libusb-1.0-0-dev libunwind-dev liblzma-dev libexpat1-dev \
            libgcrypt20-dev libgpg-error-dev libprotobuf-dev protobuf-compiler libgtest-dev
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qwc-core-ubuntu22-x86_64-gcc11-dynamic-v1-${{ inputs.expected_revision }}
          restore-keys: qwc-core-ubuntu22-x86_64-gcc11-dynamic-v1-
      - name: Configure exact release targets
        run: |
          cmake -S source -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_64=ON -DSTATIC=OFF \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=ON -DBUILD_DOCUMENTATION=OFF \
            -DBUILD_DEBUG_UTILITIES=OFF -DUSE_DEVICE_TREZOR=OFF -DUSE_READLINE=OFF \
            -DMANUAL_SUBMODULES=1 -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DMONERO_PARALLEL_COMPILE_JOBS=2 \
            -DMONERO_PARALLEL_LINK_JOBS=1
      - name: Build required programs and focused EPoSE tests
        run: cmake --build build/linux --target daemon simplewallet wallet_rpc_server epose_unit_tests --parallel 2
      - name: Run candidate-bound EPoSE tests and gate evaluation
        run: |
          set -euo pipefail
          mkdir -p evidence/linux
          build/linux/tests/unit_tests/epose_unit_tests --gtest_list_tests \
            | tee evidence/linux/EPoSE-UNIT-TEST-LIST.log
          test "$(awk '/^  [^ ]/ {count++} END {print count+0}' evidence/linux/EPoSE-UNIT-TEST-LIST.log)" -eq 238
          ctest --test-dir build/linux -R '^epose_unit_tests$' --output-on-failure 2>&1 | tee evidence/linux/EPoSE-UNIT-TESTS.log
          (cd source/tests/epose && python3 -m unittest \
            test_release_gate_v2.py test_manifest_v2.py test_reference_model_v2.py test_security_parameter_model.py) \
            2>&1 | tee evidence/linux/EPoSE-PYTHON-TESTS.log
          grep -Eq '^Ran 43 tests in ' evidence/linux/EPoSE-PYTHON-TESTS.log
          if [[ "$RELEASE_TAG" != *-rc* && "$STABLE_GATE_POLICY" == require-ready ]]; then
            control/tools/release/evaluate_release_gate.py --repository source \
              --expected-revision "$EXPECTED_REVISION" --output evidence/linux/epose-gate.json --require-ready
          else
            control/tools/release/evaluate_release_gate.py --repository source \
              --expected-revision "$EXPECTED_REVISION" --output evidence/linux/epose-gate.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("evidence/linux/pre-package-evidence.json").write_text(json.dumps({
              "schema_version": 1,
              "build_targets": "pass",
              "source_integrity_before_and_after_build": "pass",
              "epose_unit_tests": "238 tests pass",
              "epose_python_tests": "43 tests pass",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Verify source integrity after build
        run: (cd source && ../control/tools/release/check_source_tree.sh "$EXPECTED_REVISION")
      - name: Write measured build metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("evidence/linux/build-options.json").write_text(json.dumps({
              "type": "Release", "architecture_option": "default", "build_64": True,
              "static_external_libraries": False, "shared_internal_libraries": False,
              "use_device_trezor": False, "use_readline": False,
              "targets": ["daemon", "simplewallet", "wallet_rpc_server"]
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          (cd source && ../control/tools/release/write_build_info.py \
            --output ../evidence/linux/BUILD-INFO.json --release-tag "$RELEASE_TAG" \
            --expected-revision "$EXPECTED_REVISION" --workflow-revision "$GITHUB_SHA" \
            --workflow-name qwc/core-release-candidate --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-os Linux --runner-arch x86_64 \
            --compiler "$(c++ --version | head -n 1)" --cmake "$(cmake --version | head -n 1)" \
            --sdk "$(lsb_release -ds)" \
            --toolchain ubuntu-22.04-gcc --build-options ../evidence/linux/build-options.json \
            --gate ../evidence/linux/epose-gate.json --evidence ../evidence/linux/pre-package-evidence.json \
            --compatibility 'x86_64; GLIBC <= 2.35; GLIBCXX <= 3.4.30' --signing-status unsigned)
      - name: Package and test exact portable candidate
        env:
          QWC_BUILD_INFO: ${{ github.workspace }}/evidence/linux/BUILD-INFO.json
          QWC_RELEASE_EVIDENCE: ${{ github.workspace }}/evidence/linux/pre-package-evidence.json
          QWC_RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/evidence/linux
          QWC_EPOSE_GATE: ${{ github.workspace }}/evidence/linux/epose-gate.json
          QWC_RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          (cd source && ../control/tools/release/package_core.sh ../build/linux "$ARTIFACT_NAME" ../dist linux)
          (cd dist && sha256sum -c "$ARTIFACT_NAME.tar.gz.sha256")
          control/tools/release/verify_candidate_archive.py \
            --archive "dist/$ARTIFACT_NAME.tar.gz" --destination verified/linux \
            --root-name "$ARTIFACT_NAME" --platform linux --expected-tag "$RELEASE_TAG" \
            --expected-revision "$EXPECTED_REVISION" --expected-workflow-name qwc/core-release-candidate \
            --expected-workflow-revision "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" --expected-os Linux --expected-arch x86_64
          control/tools/release/smoke_core.py \
            --package-root "verified/linux/$ARTIFACT_NAME" \
            --expected-version "$QWC_RELEASE_VERSION" --output verified/linux-post-extract-smoke.json
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.ARTIFACT_NAME }}.tar.gz
            dist/${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS Apple Silicon
    needs: preflight
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 360
    concurrency:
      group: qwc-core-macos-${{ inputs.release_tag }}-${{ inputs.expected_revision }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      ARTIFACT_NAME: qwertycoin-${{ inputs.release_tag }}-macos-arm64
      CCACHE_DIR: .ccache-macos
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      QWC_MACOS_MIN_VERSION: "15.0"
      STABLE_GATE_POLICY: ${{ inputs.stable_gate_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, path: control, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_revision }}
          fetch-depth: 0
          submodules: recursive
          path: source
          persist-credentials: false
      - name: Verify source and prepare identical local tag state
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          (cd source && ../control/tools/release/check_source_tree.sh "$EXPECTED_REVISION")
          (cd source && ../control/tools/release/prepare_source_tag.sh "$RELEASE_TAG" "$EXPECTED_REVISION")
      - name: Install build and packaging dependencies
        run: brew install boost hidapi openssl@3 zeromq libpgm unbound libunwind-headers protobuf ccache libsodium libgcrypt libgpg-error expat
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qwc-core-macos15-arm64-clang-dynamic-v1-${{ inputs.expected_revision }}
          restore-keys: qwc-core-macos15-arm64-clang-dynamic-v1-
      - name: Configure exact release targets
        run: |
          cmake -S source -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DARCH=armv8-a -DBUILD_64=ON -DSTATIC=OFF \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_DOCUMENTATION=OFF \
            -DBUILD_DEBUG_UTILITIES=OFF -DUSE_DEVICE_TREZOR=OFF -DUSE_READLINE=OFF \
            -DMANUAL_SUBMODULES=1 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$QWC_MACOS_MIN_VERSION" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMONERO_PARALLEL_COMPILE_JOBS=2 -DMONERO_PARALLEL_LINK_JOBS=1
      - name: Build required programs
        run: cmake --build build/macos --target daemon simplewallet wallet_rpc_server --parallel 2
      - name: Evaluate EPoSE gate and write evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/macos
          if [[ "$RELEASE_TAG" != *-rc* && "$STABLE_GATE_POLICY" == require-ready ]]; then
            control/tools/release/evaluate_release_gate.py --repository source \
              --expected-revision "$EXPECTED_REVISION" --output evidence/macos/epose-gate.json --require-ready
          else
            control/tools/release/evaluate_release_gate.py --repository source \
              --expected-revision "$EXPECTED_REVISION" --output evidence/macos/epose-gate.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("evidence/macos/pre-package-evidence.json").write_text(json.dumps({
              "schema_version": 1, "build_targets": "pass",
              "source_integrity_before_and_after_build": "pass",
              "epose_tests": "candidate-bound Linux evidence required for assembly"
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path("evidence/macos/build-options.json").write_text(json.dumps({
              "type": "Release", "architecture_option": "armv8-a", "build_64": True,
              "static_external_libraries": False, "shared_internal_libraries": False,
              "use_device_trezor": False, "use_readline": False,
              "targets": ["daemon", "simplewallet", "wallet_rpc_server"]
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          (cd source && ../control/tools/release/check_source_tree.sh "$EXPECTED_REVISION")
          library_path="$(brew --prefix)/lib"
          for formula in boost openssl@3 zeromq libpgm unbound libsodium libgcrypt libgpg-error expat; do
            prefix=$(brew --prefix "$formula")
            library_path="$library_path:$prefix/lib"
          done
          echo "QWC_MACOS_LIBRARY_PATH=$library_path" >> "$GITHUB_ENV"
          (cd source && ../control/tools/release/write_build_info.py \
            --output ../evidence/macos/BUILD-INFO.json --release-tag "$RELEASE_TAG" \
            --expected-revision "$EXPECTED_REVISION" --workflow-revision "$GITHUB_SHA" \
            --workflow-name qwc/core-release-candidate --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-os macOS --runner-arch arm64 \
            --compiler "$(c++ --version | head -n 1)" --cmake "$(cmake --version | head -n 1)" \
            --sdk "macOS $(sw_vers -productVersion); SDK $(xcrun --sdk macosx --show-sdk-version); $(xcodebuild -version | tr '\n' ' ')" \
            --toolchain macos-15-apple-clang --build-options ../evidence/macos/build-options.json \
            --gate ../evidence/macos/epose-gate.json --evidence ../evidence/macos/pre-package-evidence.json \
            --compatibility 'Apple Silicon; macOS 15.0 or newer' --signing-status 'ad-hoc; not Developer ID signed or notarized')
      - name: Package and test exact portable candidate
        env:
          QWC_BUILD_INFO: ${{ github.workspace }}/evidence/macos/BUILD-INFO.json
          QWC_RELEASE_EVIDENCE: ${{ github.workspace }}/evidence/macos/pre-package-evidence.json
          QWC_RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/evidence/macos
          QWC_EPOSE_GATE: ${{ github.workspace }}/evidence/macos/epose-gate.json
          QWC_RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          (cd source && ../control/tools/release/package_core.sh ../build/macos "$ARTIFACT_NAME" ../dist macos)
          (cd dist && shasum -a 256 -c "$ARTIFACT_NAME.tar.gz.sha256")
          control/tools/release/verify_candidate_archive.py \
            --archive "dist/$ARTIFACT_NAME.tar.gz" --destination verified/macos \
            --root-name "$ARTIFACT_NAME" --platform macos --expected-tag "$RELEASE_TAG" \
            --expected-revision "$EXPECTED_REVISION" --expected-workflow-name qwc/core-release-candidate \
            --expected-workflow-revision "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" --expected-os macOS --expected-arch arm64
          control/tools/release/smoke_core.py \
            --package-root "verified/macos/$ARTIFACT_NAME" \
            --expected-version "$QWC_RELEASE_VERSION" --output verified/macos-post-extract-smoke.json
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.ARTIFACT_NAME }}.tar.gz
            dist/${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows-x86_64:
    name: Windows x86_64
    needs: preflight
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 360
    concurrency:
      group: qwc-core-windows-${{ inputs.release_tag }}-${{ inputs.expected_revision }}
      cancel-in-progress: false
    defaults:
      run:
        shell: msys2 {0}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      ARTIFACT_NAME: qwertycoin-${{ inputs.release_tag }}-windows-x86_64
      CCACHE_DIR: .ccache-windows
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      STABLE_GATE_POLICY: ${{ inputs.stable_gate_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, path: control, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_revision }}
          fetch-depth: 0
          submodules: false
          path: source
          persist-credentials: false
      - name: Configure native MSYS2 environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git zip base-devel
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache mingw-w64-x86_64-python mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl mingw-w64-x86_64-libgcrypt mingw-w64-x86_64-libgpg-error
            mingw-w64-x86_64-zeromq mingw-w64-x86_64-libsodium mingw-w64-x86_64-unbound
            mingw-w64-x86_64-expat mingw-w64-x86_64-hidapi mingw-w64-x86_64-libusb
            mingw-w64-x86_64-protobuf
      - name: Initialize exact recursive submodules and local tag state
        run: |
          set -euo pipefail
          git -C source submodule sync --recursive
          git -C source submodule update --init --recursive
          (cd source && ../control/tools/release/check_source_tree.sh "$EXPECTED_REVISION")
          (cd source && ../control/tools/release/prepare_source_tag.sh "$RELEASE_TAG" "$EXPECTED_REVISION")
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qwc-core-windows2025-x86_64-mingw64-dynamic-v1-${{ inputs.expected_revision }}
          restore-keys: qwc-core-windows2025-x86_64-mingw64-dynamic-v1-
      - name: Configure exact release targets
        run: |
          cmake -S source -B build/windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_64=ON -DSTATIC=OFF \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_DOCUMENTATION=OFF \
            -DBUILD_DEBUG_UTILITIES=OFF -DUSE_DEVICE_TREZOR=OFF -DUSE_READLINE=OFF \
            -DMANUAL_SUBMODULES=1 -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DMONERO_PARALLEL_COMPILE_JOBS=2 \
            -DMONERO_PARALLEL_LINK_JOBS=1
      - name: Build required programs
        run: cmake --build build/windows --target daemon simplewallet wallet_rpc_server --parallel 2
      - name: Evaluate EPoSE gate and write evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/windows
          if [[ "$RELEASE_TAG" != *-rc* && "$STABLE_GATE_POLICY" == require-ready ]]; then
            python3 control/tools/release/evaluate_release_gate.py --repository source \
              --expected-revision "$EXPECTED_REVISION" --output evidence/windows/epose-gate.json --require-ready
          else
            python3 control/tools/release/evaluate_release_gate.py --repository source \
              --expected-revision "$EXPECTED_REVISION" --output evidence/windows/epose-gate.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("evidence/windows/pre-package-evidence.json").write_text(json.dumps({
              "schema_version": 1, "build_targets": "pass",
              "source_integrity_before_and_after_build": "pass",
              "epose_tests": "candidate-bound Linux evidence required for assembly"
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path("evidence/windows/build-options.json").write_text(json.dumps({
              "type": "Release", "architecture_option": "default", "build_64": True,
              "static_external_libraries": False, "shared_internal_libraries": False,
              "use_device_trezor": False, "use_readline": False,
              "targets": ["daemon", "simplewallet", "wallet_rpc_server"]
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          (cd source && ../control/tools/release/check_source_tree.sh "$EXPECTED_REVISION")
          (cd source && ../control/tools/release/write_build_info.py \
            --output ../evidence/windows/BUILD-INFO.json --release-tag "$RELEASE_TAG" \
            --expected-revision "$EXPECTED_REVISION" --workflow-revision "$GITHUB_SHA" \
            --workflow-name qwc/core-release-candidate --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-os Windows --runner-arch x86_64 \
            --compiler "$(c++ --version | head -n 1)" --cmake "$(cmake --version | head -n 1)" \
            --sdk "$(uname -srv)" \
            --toolchain windows-2025-msys2-mingw64 --build-options ../evidence/windows/build-options.json \
            --gate ../evidence/windows/epose-gate.json --evidence ../evidence/windows/pre-package-evidence.json \
            --compatibility 'Windows x86_64; tested on windows-2025 runner' --signing-status unsigned)
      - name: Package and test exact portable candidate
        env:
          QWC_BUILD_INFO: ${{ github.workspace }}/evidence/windows/BUILD-INFO.json
          QWC_RELEASE_EVIDENCE: ${{ github.workspace }}/evidence/windows/pre-package-evidence.json
          QWC_RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/evidence/windows
          QWC_EPOSE_GATE: ${{ github.workspace }}/evidence/windows/epose-gate.json
          QWC_RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          (cd source && ../control/tools/release/package_core.sh ../build/windows "$ARTIFACT_NAME" ../dist windows)
          (cd dist && sha256sum -c "$ARTIFACT_NAME.zip.sha256")
          python3 control/tools/release/verify_candidate_archive.py \
            --archive "dist/$ARTIFACT_NAME.zip" --destination verified/windows \
            --root-name "$ARTIFACT_NAME" --platform windows --expected-tag "$RELEASE_TAG" \
            --expected-revision "$EXPECTED_REVISION" --expected-workflow-name qwc/core-release-candidate \
            --expected-workflow-revision "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" --expected-os Windows --expected-arch x86_64
          python3 control/tools/release/smoke_core.py \
            --package-root "verified/windows/$ARTIFACT_NAME" \
            --expected-version "$QWC_RELEASE_VERSION" --output verified/windows-post-extract-smoke.json
      - name: Verify packaged programs from clean PowerShell PATH
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "verified/windows/$env:ARTIFACT_NAME"
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($program in @("qwertycoind.exe", "qwertycoin-wallet-cli.exe", "qwertycoin-wallet-rpc.exe")) {
            & (Join-Path $root $program) --version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$program --version failed" }
            & (Join-Path $root $program) --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$program --help failed" }
          }
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.ARTIFACT_NAME }}.zip
            dist/${{ env.ARTIFACT_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
