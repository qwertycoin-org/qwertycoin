name: qwc/update-release-dns

on:
  pull_request:
    paths:
      - .github/workflows/update-release-dns.yml
      - tools/release/update_release_dns.py
      - tools/release/tests/test_update_release_dns.py
      - docs/epose/DNS_RECORDS.md
      - docs/releases/RELEASE_PROCESS.md
  release:
    types: [published]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional exact stable tag; empty selects the latest common Core/GUI stable tag"
        required: false
        type: string
      apply:
        description: "Apply the verified RRset (false performs a release-only plan)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qwc-release-dns
  cancel-in-progress: false

jobs:
  test:
    name: Verify DNS publisher and public release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pull-request source
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout trusted default-branch source
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run focused publisher tests
        run: python3 -m unittest tools/release/tests/test_update_release_dns.py
      - name: Verify latest common public stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release/update_release_dns.py plan

  publish:
    name: Publish exact DNSSEC updater RRset
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-dns
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      REQUESTED_TAG: ${{ inputs.release_tag }}
      REQUESTED_APPLY: ${{ inputs.apply }}
    steps:
      - name: Checkout trusted default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select plan or automatic publication mode
        shell: bash
        run: |
          set -euo pipefail
          mode=apply
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_APPLY" != true ]]; then
            mode=plan
          fi
          args=("$mode")
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            args+=(--tag "$REQUESTED_TAG")
          fi
          python3 tools/release/update_release_dns.py "${args[@]}"
