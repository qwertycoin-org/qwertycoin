[package]
name = "qwertycoin-qms-crypto"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
async-trait = "=0.1.89"
futures-util = "=0.3.32"
hex = "=0.4.3"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "e8cc2dddd578859b4a029c9c94670b24ce2b616a", package = "libsignal-protocol" }
postcard = { version = "=1.1.3", features = ["alloc"] }
rand = "=0.9.4"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.11.0"
thiserror = "=2.0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "=0.3.4", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.126"

[dev-dependencies]
serde_json = "=1.0.150"
