name: qwertycoin-epose

x-qwc-image: &qwc-image ${QWC_IMAGE:-docker.io/qwertycoin/qwertycoin:latest}

services:
  volume-init:
    image: *qwc-image
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        install -d -o 10001 -g 10001 -m 0700 /data /service-node
    volumes:
      - chain:/data
      - service-identity:/service-node
    restart: "no"

  service-node:
    image: *qwc-image
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      volume-init:
        condition: service_completed_successfully
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        exec /usr/local/bin/qwertycoin-entrypoint daemon \
          --data-dir=/data \
          --epose-v2-service \
          --epose-v2-keystore=/service-node/epose-v2-keystore \
          --epose-v2-reward-address="$${QWC_EPOSE_REWARD_ADDRESS:?set QWC_EPOSE_REWARD_ADDRESS}" \
          --epose-v2-endpoint-host="$${QWC_EPOSE_PUBLIC_HOST:?set QWC_EPOSE_PUBLIC_HOST}" \
          --epose-v2-endpoint-port="$${QWC_EPOSE_PUBLIC_PORT:-8198}" \
          --epose-v2-discovery-endpoint=http://seed-00.qwertycoin.org:8198 \
          --epose-v2-discovery-endpoint=http://seed-01.qwertycoin.org:8198 \
          --p2p-bind-ip=0.0.0.0 \
          --p2p-bind-port=8196 \
          --rpc-bind-ip=0.0.0.0 \
          --rpc-bind-port=8197 \
          --rpc-restricted-bind-ip=0.0.0.0 \
          --rpc-restricted-bind-port=8198 \
          --confirm-external-bind \
          --no-zmq \
          --non-interactive \
          --no-igd
    environment:
      QWC_EPOSE_REWARD_ADDRESS: ${QWC_EPOSE_REWARD_ADDRESS:?set QWC_EPOSE_REWARD_ADDRESS}
      QWC_EPOSE_PUBLIC_HOST: ${QWC_EPOSE_PUBLIC_HOST:?set QWC_EPOSE_PUBLIC_HOST}
      QWC_EPOSE_PUBLIC_PORT: ${QWC_EPOSE_PUBLIC_PORT:-8198}
    ports:
      - "8196:8196"
      - "127.0.0.1:8197:8197"
      - "${QWC_EPOSE_PUBLIC_PORT:-8198}:8198"
    volumes:
      - chain:/data
      - service-identity:/service-node
    restart: unless-stopped
    stop_grace_period: 2m

volumes:
  chain:
  service-identity:
